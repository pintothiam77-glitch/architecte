<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgroScan — Diagnostic intelligent des cultures</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg: #14140F; --panel: #1B1C14; --gold: #C9A227; --leaf: #7BA968;
    --rust: #C1552E; --cream: #EFE7D3; --muted: #9C9686; --line: rgba(239,231,211,0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--cream); font-family: 'Inter', sans-serif; }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.2px; color: var(--gold); text-transform: uppercase; margin-bottom: 14px; }
  header.top { display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 12px; }
  .tabbar-wrap { position: sticky; top: 0; z-index: 20; background: rgba(20,20,15,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .tabbar { max-width: 1080px; margin: 0 auto; display: flex; gap: 4px; padding: 0 28px; overflow-x: auto; scrollbar-width: none; }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab-btn { display: flex; align-items: center; gap: 7px; padding: 14px 16px 12px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all .15s ease; }
  .tab-btn:hover { color: var(--cream); }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-btn svg { flex-shrink: 0; width: 15px; height: 15px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--gold); display: flex; align-items: center; justify-content: center; }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; }
  .brand-sub { font-size: 11.5px; color: var(--muted); }
  .risk-badge { font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .hero { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 40px; padding: 48px 28px 40px; max-width: 1080px; margin: 0 auto; align-items: center; }
  .hero h1 { font-family: 'Fraunces', serif; font-size: clamp(28px, 4vw, 42px); line-height: 1.12; font-weight: 600; margin: 0 0 18px; }
  .hero p { color: var(--muted); font-size: 15.5px; line-height: 1.6; max-width: 480px; margin: 0; }
  .lead-stats { display: flex; gap: 28px; margin-top: 26px; font-size: 13px; color: var(--muted); }
  .lead-stats b { font-family: 'Fraunces', serif; font-size: 22px; color: var(--cream); display: block; font-weight: 600; }
  .hero-visual { position: relative; display: flex; justify-content: center; align-items: center; height: 220px; }
  .scan-frame { position: absolute; top: 6%; left: 50%; transform: translateX(-50%); width: 160px; height: 88%; overflow: hidden; pointer-events: none; }
  .scanline { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); box-shadow: 0 0 12px var(--gold); animation: scan 3.2s ease-in-out infinite; }
  .scan-caption { position: absolute; bottom: -8px; font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 5px; width: 100%; justify-content: center; }
  @keyframes scan { 0% { top: 6%; } 50% { top: 90%; } 100% { top: 6%; } }
  .panel { max-width: 1080px; margin: 0 auto 28px; padding: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .chip { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--cream); font-size: 13.5px; cursor: pointer; transition: all .15s ease; }
  .chip:hover { border-color: var(--gold); }
  .chip.active { border-color: var(--gold); background: rgba(201,162,39,0.12); color: var(--gold); }
  .drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all .15s ease; }
  .drop:hover { border-color: var(--gold); background: rgba(201,162,39,0.04); }
  .drop-title { margin-top: 10px; font-weight: 500; }
  .drop-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 4px; }
  .photo-thumb-wrap { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 1; animation: fadeUp .35s ease both; }
  .photo-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .thumb-x { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(20,20,15,0.75); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s ease; }
  .thumb-x:hover { background: var(--rust); }
  .add-more-tile { border: 1.5px dashed var(--line); border-radius: 10px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn-primary { background: var(--gold); color: #14140F; border: none; padding: 11px 22px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .15s ease; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--cream); border: 1px solid var(--line); padding: 11px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all .15s ease; }
  .btn-ghost:hover { border-color: var(--gold); }
  .btn-ghost-small { background: transparent; color: var(--cream); border: 1px solid var(--line); padding: 7px 12px; border-radius: 7px; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .15s ease; }
  .btn-ghost-small:hover { border-color: var(--gold); }
  button:focus-visible, .drop:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .error-box { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--rust); border-radius: 8px; color: var(--rust); font-size: 13.5px; display: flex; gap: 8px; align-items: center; animation: fadeUp .35s ease both; }
  .skeleton-wrap { display: flex; flex-direction: column; gap: 10px; padding: 18px 0; animation: fadeUp .35s ease both; }
  .skeleton-line { background: linear-gradient(90deg, rgba(239,231,211,0.06) 25%, rgba(239,231,211,0.14) 50%, rgba(239,231,211,0.06) 75%); background-size: 400px 100%; animation: shimmer 1.4s infinite; border-radius: 6px; height: 12px; }
  @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  .result-card { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); animation: fadeUp .35s ease both; }
  .result-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .severity-tag { font-size: 11.5px; font-family: 'JetBrains Mono', monospace; border: 1px solid; border-radius: 999px; padding: 3px 10px; height: fit-content; white-space: nowrap; }
  .diagnosis-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .diagnosis-name { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; flex: 1; }
  .confidence { font-size: 12.5px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .result-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .field-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--gold); margin-bottom: 5px; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 5px; }
  .field-value { font-size: 14.5px; line-height: 1.55; color: var(--cream); }
  .plan-block { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
  .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .plan-progress-bar { height: 5px; background: rgba(239,231,211,0.08); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .plan-progress-fill { height: 100%; background: var(--leaf); border-radius: 999px; transition: width .3s ease; }
  .plan-list { display: flex; flex-direction: column; gap: 8px; }
  .plan-item { display: flex; gap: 10px; align-items: flex-start; background: rgba(239,231,211,0.03); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--cream); width: 100%; text-align: left; transition: all .15s ease; }
  .plan-item:hover { border-color: var(--gold); background: rgba(201,162,39,0.05); }
  .plan-item.done { opacity: 0.55; }
  .plan-item.done .plan-action { text-decoration: line-through; }
  .plan-day { font-size: 11.5px; color: var(--gold); font-family: 'JetBrains Mono', monospace; margin-bottom: 2px; }
  .plan-action { font-size: 14px; }
  .plan-produit { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .plan-warning { margin-top: 14px; font-size: 12.5px; color: var(--rust); display: flex; gap: 6px; align-items: flex-start; line-height: 1.5; }
  .result-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; gap: 12px; }
  .feedback-group { display: flex; align-items: center; gap: 8px; }
  .fb-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s ease; }
  .fb-btn:hover { border-color: var(--gold); }
  .fb-btn.active-up { border-color: var(--leaf); color: var(--leaf); }
  .fb-btn.active-down { border-color: var(--rust); color: var(--rust); }
  .metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  .metric-card { border: 1px solid var(--line); border-radius: 10px; padding: 16px 14px; }
  .metric-val { font-family: 'Fraunces', serif; font-size: 24px; margin-top: 8px; }
  .metric-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .sensor-note { font-size: 13px; color: var(--muted); line-height: 1.55; }
  .chart-wrap { display: flex; align-items: flex-end; gap: 14px; height: 120px; margin-bottom: 22px; padding: 0 4px; }
  .chart-bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1; height: 100%; gap: 6px; }
  .chart-bar { width: 100%; max-width: 34px; background: var(--gold); border-radius: 4px 4px 0 0; min-height: 4px; }
  .chart-count { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .chart-label { font-size: 11px; color: var(--muted); text-align: center; }
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-item { display: flex; gap: 12px; align-items: center; }
  .history-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }
  .history-title { font-weight: 600; font-size: 14px; }
  .history-sub { color: var(--muted); font-weight: 400; }
  .history-time { font-size: 12px; color: var(--muted); }
  footer.bottom { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 20px; padding: 0 28px; }
  .search-row { position: relative; margin-bottom: 18px; }
  .search-row input { width: 100%; background: rgba(239,231,211,0.04); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px 10px 38px; color: var(--cream); font-size: 14px; font-family: inherit; }
  .search-row input:focus { outline: none; border-color: var(--gold); }
  .search-row input::placeholder { color: var(--muted); }
  .search-row .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .disease-list { display: flex; flex-direction: column; gap: 8px; }
  .disease-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; transition: border-color .15s ease; }
  .disease-card.open { border-color: var(--gold); }
  .disease-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 14px; background: transparent; border: none; color: var(--cream); cursor: pointer; text-align: left; }
  .disease-head:hover { background: rgba(239,231,211,0.03); }
  .disease-name { font-weight: 600; font-size: 14.5px; flex: 1; }
  .disease-type { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .disease-chevron { transition: transform .15s ease; flex-shrink: 0; }
  .disease-card.open .disease-chevron { transform: rotate(90deg); }
  .disease-body { padding: 0 14px 16px; display: flex; flex-direction: column; gap: 12px; animation: fadeUp .25s ease both; }
  .disease-empty { color: var(--muted); font-size: 13.5px; padding: 12px 2px; }
  .meteo-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
  .meteo-updated { font-size: 11.5px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .meteo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 16px; }
  .meteo-card { border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; }
  .meteo-card-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 8px; }
  .meteo-region { font-weight: 600; font-size: 14px; }
  .meteo-status { font-size: 12.5px; line-height: 1.5; }
  .meteo-prob { font-size: 11.5px; color: var(--muted); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .metrics-row { grid-template-columns: 1fr 1fr; }
    .photo-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scanline, .fade-up, .skeleton-line, .photo-thumb-wrap, .result-card, .error-box { animation: none !important; }
  }
  .radar-map { height: 360px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .radar-controls { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .radar-slider { flex: 1; min-width: 140px; accent-color: var(--gold); }
  .radar-time { font-size: 12.5px; font-family: 'JetBrains Mono', monospace; color: var(--cream); white-space: nowrap; }
  .radar-tag { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  .radar-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .radar-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--cream); }
  .leaflet-popup-tip { background: var(--panel); }

  /* ---------- Auth screen ---------- */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; }
  .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .auth-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; margin: 4px 0 22px; }
  .auth-tabs { display: flex; gap: 4px; margin-bottom: 20px; border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .auth-tab-btn { flex: 1; padding: 9px 10px; border-radius: 7px; border: none; background: transparent; color: var(--muted); font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .auth-tab-btn.active { background: var(--gold); color: #14140F; }
  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .6px; }
  .auth-field input { width: 100%; background: rgba(239,231,211,0.04); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; color: var(--cream); font-size: 14px; font-family: inherit; }
  .auth-field input:focus { outline: none; border-color: var(--gold); }
  .auth-hint { font-size: 12px; color: var(--muted); margin-top: -6px; margin-bottom: 14px; line-height: 1.5; }
  .auth-error { color: var(--rust); font-size: 13px; margin-bottom: 14px; display: flex; gap: 6px; align-items: center; }
  .auth-success { color: var(--leaf); font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  .auth-codes { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.6; }
  .auth-codes code { color: var(--gold); background: rgba(201,162,39,0.1); padding: 1px 6px; border-radius: 4px; }

  /* ---------- Settings ---------- */
  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); gap: 12px; }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: 14px; font-weight: 500; }
  .settings-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .toggle-switch { width: 42px; height: 24px; border-radius: 999px; border: 1px solid var(--line); background: rgba(239,231,211,0.06); position: relative; cursor: pointer; flex-shrink: 0; transition: all .15s ease; }
  .toggle-switch.on { background: var(--gold); border-color: var(--gold); }
  .toggle-switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--cream); transition: all .15s ease; }
  .toggle-switch.on .knob { left: 20px; background: #14140F; }

  /* ---------- Cartographie nationale ---------- */
  .carto-map { height: 380px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 18px; }
  .carto-selects { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .carto-select { width: 100%; background: rgba(239,231,211,0.04); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--cream); font-size: 13.5px; font-family: inherit; }
  .carto-scan-btn { width: 100%; margin-top: 4px; }
  .risk-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid; }
  .carto-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 18px 0; }
  .carto-metric { border: 1px solid var(--line); border-radius: 10px; padding: 13px; }
  .carto-metric-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-family: 'JetBrains Mono', monospace; }
  .carto-metric-val { font-family: 'Fraunces', serif; font-size: 19px; margin-top: 6px; }
  .solution-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .solution-item { display: flex; gap: 10px; align-items: flex-start; background: rgba(239,231,211,0.03); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .solution-name { font-size: 13.5px; font-weight: 600; }
  .solution-detail { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .evolution-row { display: flex; align-items: flex-end; gap: 8px; height: 100px; margin: 14px 0; padding: 0 2px; }
  .evolution-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 5px; }
  .evolution-bar { width: 100%; max-width: 30px; border-radius: 4px 4px 0 0; min-height: 4px; }
  .evolution-label { font-size: 10.5px; color: var(--muted); }
  .pred-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .pred-chip { flex: 1; min-width: 90px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 6px; }
  .pred-chip b { display: block; font-family: 'Fraunces', serif; font-size: 16px; margin-top: 3px; }
  .village-add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .village-add-row input { flex: 1; min-width: 100px; background: rgba(239,231,211,0.04); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; color: var(--cream); font-size: 13px; font-family: inherit; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--gold); color: var(--cream); padding: 12px 20px; border-radius: 10px; font-size: 13.5px; z-index: 100; animation: fadeUp .3s ease both; }

/* ---------- Simulation de détection satellite (déterministe, basée sur la localité) ---------- */
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
function simulateSatelliteScan(locationKey) {
  const rnd = seededRandom(hashSeed(locationKey));
  const ec = +(0.5 + rnd() * 15).toFixed(1);
  const ph = +(6.2 + rnd() * 2.3).toFixed(1);
  const humidite = Math.round(20 + rnd() * 55);
  const temperature = +(24 + rnd() * 12).toFixed(1);
  const sodium = Math.round(50 + rnd() * 900);
  const matiereOrganique = +(0.5 + rnd() * 3.2).toFixed(1);
  const superficie = Math.round(15 + rnd() * 480);
  const risk = cartoRiskFromEc(ec);
  return { ec, ph, humidite, temperature, sodium, matiereOrganique, superficie, risk };
}
function cartoRiskFromEc(ec) {
  if (ec <= 2) return { level: "Faible", color: "var(--leaf)" };
  if (ec <= 4) return { level: "Modéré", color: "var(--gold)" };
  if (ec <= 8) return { level: "Élevé", color: "var(--rust)" };
  return { level: "Extrême", color: "var(--rust)" };
}
function generateAISolutions(ec, superficieHa) {
  const level = cartoRiskFromEc(ec).level;
  const solutions = [];
  if (ec > 2) solutions.push({ name: "Drainage des parcelles", detail: "Mise en place ou remise en état de fossés de drainage pour évacuer l'excès d'eau salée et abaisser la nappe." });
  if (ec > 3) solutions.push({ name: "Lessivage des sels", detail: "Irrigation à l'eau douce en excès pour entraîner les sels sous la zone racinaire, en 2 à 3 passages." });
  if (ec > 4) solutions.push({ name: "Apport de gypse (CaSO₄)", detail: `Dose indicative : ${Math.round(2000 + ec * 350)} kg/ha, incorporé avant la campagne pour déplacer le sodium échangeable.` });
  if (ec > 5) solutions.push({ name: "Utilisation de biochar", detail: `Dose indicative : ${Math.round(1500 + ec * 200)} kg/ha, améliore la rétention d'eau et la structure du sol.` });
  solutions.push({ name: "Fertilisation adaptée", detail: "Privilégier les engrais à base de sulfate plutôt que de chlorure ; fractionner les apports d'azote." });
  if (ec > 6) solutions.push({ name: "Espèces tolérantes au sel", detail: "Réorienter vers sorgho, patate douce, niébé ou riz tolérant (NERICA) le temps de la réhabilitation." });
  solutions.push({ name: "Calendrier des interventions", detail: "Drainage avant hivernage → lessivage en début de saison des pluies → amendement (gypse/biochar) 3-4 semaines avant semis." });
  const coutHa = ec > 6 ? 380000 : ec > 3 ? 240000 : 90000;
  const coutTotal = Math.round(coutHa * superficieHa);
  const gainPct = ec > 6 ? "35 à 55 %" : ec > 3 ? "20 à 35 %" : "10 à 15 %";
  solutions.push({ name: "Estimation du coût de réhabilitation", detail: `≈ ${coutTotal.toLocaleString("fr-FR")} FCFA pour ${superficieHa} ha (${coutHa.toLocaleString("fr-FR")} FCFA/ha), niveau de risque « ${level} ».` });
  solutions.push({ name: "Gain de rendement estimé après réhabilitation", detail: `+${gainPct} de rendement attendu sur les cultures sensibles, sur 1 à 2 campagnes après traitement.` });
  return solutions;
}
function cartoHistory(locationKey) {
  const rnd = seededRandom(hashSeed(locationKey + ":hist"));
  const years = [2021, 2022, 2023, 2024, 2025];
  let base = 2 + rnd() * 4;
  const values = years.map(() => {
    base = Math.max(0.3, base + (rnd() - 0.42) * 1.3);
    return +base.toFixed(1);
  });
  const trend = (values[values.length - 1] - values[0]) / (values.length - 1);
  const predict = (n) => Math.max(0.2, +(values[values.length - 1] + trend * n).toFixed(1));
  return { years, values, predictions: { 1: predict(1), 3: predict(3), 5: predict(5) } };
}

function dakarNow() {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Dakar", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t).value;
  return { date: `${get("year")}-${get("month")}-${get("day")}`, hour: parseInt(get("hour"), 10), minute: parseInt(get("minute"), 10) };
}
function hourLabel(h) { return `${String(h).padStart(2, "0")}h`; }
function minuteLabel(q) { return `${String(q.h).padStart(2, "0")}h${String(q.m).padStart(2, "0")}`; }
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function describeRainDay(day, label) {
  let color, text;
  if (!day.window) { color = "var(--leaf)"; text = `${label} : pas de pluie prévue`; }
  else if (day.window.past) { color = "var(--muted)"; text = `${label} : pluie passée ${minuteLabel(day.window.start)}–${minuteLabel(day.window.end)}`; }
  else if (day.window.start.h === day.window.end.h && day.window.start.m === day.window.end.m) { color = "var(--rust)"; text = `${label} : pluie probable vers ${minuteLabel(day.window.start)}`; }
  else { color = "var(--rust)"; text = `${label} : pluie probable ${minuteLabel(day.window.start)}–${minuteLabel(day.window.end)}`; }
  return { color, text };
}

  { niveau: "Très élevée", ecMax: 16, description: "Seules les cultures tolérantes au sel se développent normalement ; risque élevé de perte de récolte sans amendement." },

function salinityLevelFromEc(ec) {
  return SALINITY_LEVELS.find((l) => ec <= l.ecMax) || SALINITY_LEVELS[SALINITY_LEVELS.length - 1];
}

function salinityAdvice(cropId, ec) {
  const crop = SALINITY_CROPS[cropId];

  return { level, crop, overThreshold };

function salinityRegions() {
  return [...new Set(SALINITY_FIELD_DATA.map((r) => r.r))].sort();
}
function salinityDepartements(region) {
  return [...new Set(SALINITY_FIELD_DATA.filter((r) => r.r === region).map((r) => r.d))].sort();
}
function salinityCommunes(region, departement) {
  return [...new Set(SALINITY_FIELD_DATA.filter((r) => r.r === region && r.d === departement).map((r) => r.c))].sort();
}
function salinityCultures(region, departement, commune) {
  return [...new Set(SALINITY_FIELD_DATA.filter((r) => r.r === region && r.d === departement && r.c === commune).map((r) => r.cu))].sort();
}
function salinityFieldRecords(region, departement, commune, culture) {
  return SALINITY_FIELD_DATA.filter((r) => r.r === region && r.d === departement && r.c === commune && (!culture || r.cu === culture))
    .sort((a, b) => b.dt.localeCompare(a.dt));
}
function priorityColor(p) {
  if (p === 'Critique') return 'var(--rust)';
  if (p === 'Élevée') return 'var(--rust)';
  if (p === 'Moyenne') return 'var(--gold)';
  return 'var(--leaf)';
}

function riskFromSensor(s) {
  if (s.humidity > 70 && s.temp > 28) return { level: "Élevé", color: "var(--rust)" };
  if (s.humidity > 55) return { level: "Modéré", color: "var(--gold)" };
  return { level: "Faible", color: "var(--leaf)" };
}
function dayLabel(jour) {
  if (jour === 0) return "Aujourd'hui";
  if (jour === 1) return "Demain";
  return `Dans ${jour} jours`;
}
function severityColor(g) {
  return g === "Élevée" ? "var(--rust)" : g === "Modérée" ? "var(--gold)" : "var(--leaf)";
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = () => reject(new Error("Lecture du fichier impossible"));
    r.readAsDataURL(file);
  });
}
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}

async function loadMeteo() {
  state.meteo.loading = true;
  state.meteo.error = null;
  render();
  try {
    const lats = REGIONS.map((r) => r.lat).join(",");
    const lons = REGIONS.map((r) => r.lon).join(",");
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&hourly=precipitation_probability,precipitation&minutely_15=precipitation&timezone=Africa%2FDakar&forecast_days=2`;
    const meteoRes = await fetch(url).then((r) => { if (!r.ok) throw new Error("Réponse réseau invalide"); return r.json(); });
    const arr = Array.isArray(meteoRes) ? meteoRes : [meteoRes];
    const { date: todayDate, hour: curHour, minute: curMinute } = dakarNow();
    const tomorrowDate = addDays(todayDate, 1);

    const computeWindow = (quarters, isToday) => {
      const rainy = quarters.filter((x) => x.prob >= 45 || x.mm >= 0.1);
      const relevant = isToday ? rainy.filter((x) => x.h > curHour || (x.h === curHour && x.m >= curMinute)) : rainy;
      if (relevant.length) return { start: relevant[0], end: relevant[relevant.length - 1], past: false };
      if (isToday && rainy.length) return { start: rainy[0], end: rainy[rainy.length - 1], past: true };
      return null;
    };

    const results = REGIONS.map((r, i) => {
      const h = (arr[i] || {}).hourly;
      const q15 = (arr[i] || {}).minutely_15;
      if (!h || !h.time) return { name: r.name, error: true };
      const hourProb = {};
      h.time.forEach((t, idx) => { hourProb[t.slice(0, 13)] = (h.precipitation_probability || [])[idx] || 0; });
      const extractQuarters = (dateStr) => {
        if (!q15 || !q15.time) return [];
        return q15.time
          .map((t, idx) => ({ t, idx }))
          .filter((o) => o.t.slice(0, 10) === dateStr)
          .map((o) => ({
            h: parseInt(o.t.slice(11, 13), 10),
            m: parseInt(o.t.slice(14, 16), 10),
            mm: (q15.precipitation || [])[o.idx] || 0,
            prob: hourProb[o.t.slice(0, 13)] || 0,
          }));
      };
      const quartersToday = extractQuarters(todayDate);
      const quartersTomorrow = extractQuarters(tomorrowDate);
      const maxProbFor = (dateStr) => {
        const vals = h.time.map((t, idx) => (t.slice(0, 10) === dateStr ? (h.precipitation_probability || [])[idx] || 0 : -1)).filter((v) => v >= 0);
        return vals.length ? Math.max(...vals) : 0;
      };
      const today = { window: computeWindow(quartersToday, true), maxProb: maxProbFor(todayDate) };
      const tomorrow = { window: computeWindow(quartersTomorrow, false), maxProb: maxProbFor(tomorrowDate) };
      return { name: r.name, today, tomorrow };
    });
    state.meteo.data = results;
    state.meteo.updatedAt = new Date();
    state.meteo.loading = false;
    render();
  } catch (e) {
    state.meteo.loading = false;
    state.meteo.error = "Prévisions indisponibles — vérifiez la connexion et réessayez.";
    render();
  }
}
async function loadRadar() {
  state.radar.loading = true;
  state.radar.error = null;
  render();
  try {
    const res = await fetch("https://api.rainviewer.com/public/weather-maps.json");
    if (!res.ok) throw new Error("Réseau radar indisponible");
    const json = await res.json();
    const host = json.host || "https://tilecache.rainviewer.com";
    const past = (json.radar && json.radar.past) || [];
    const nowcast = (json.radar && json.radar.nowcast) || [];
    const frames = [...past, ...nowcast];
    state.radar.host = host;
    state.radar.frames = frames;
    state.radar.index = past.length ? past.length - 1 : 0;
    state.radar.loading = false;

    state.radar.error = "Imagerie satellite indisponible — la carte s'affiche sans couche pluie.";

  if (r.today.window && !r.today.window.past) return "var(--rust)";

function initMap() {
  const container = document.getElementById("meteo-map");
  if (!container || typeof L === "undefined") return;
  let center = [14.4974, -14.4524];
  let zoom = 7;
  if (leafletMap) {
    try {
      const c = leafletMap.getCenter();
      center = [c.lat, c.lng];
      zoom = leafletMap.getZoom();
    } catch (e) { /* ignore */ }
    leafletMap.remove();
    leafletMap = null;
  }
  leafletMap = L.map(container, { center, zoom, zoomControl: true, attributionControl: false });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { maxZoom: 12, subdomains: "abcd" }).addTo(leafletMap);
  const frame = state.radar.frames[state.radar.index];
  if (frame && state.radar.host) {
    L.tileLayer(`${state.radar.host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, { opacity: 0.55, maxZoom: 12 }).addTo(leafletMap);
  }
  (state.meteo.data || []).forEach((r) => {
    const region = REGIONS.find((x) => x.name === r.name);
    if (!region) return;
    const color = regionColor(r);
    const marker = L.circleMarker([region.lat, region.lon], { radius: 9, color, fillColor: color, fillOpacity: 0.85, weight: 1.5 }).addTo(leafletMap);
    const todayText = r.error ? "Données indisponibles" : describeRainDay(r.today, "Aujourd'hui").text;
    const tomorrowText = r.error ? "" : describeRainDay(r.tomorrow, "Demain").text;
    marker.bindPopup(`<b>${escapeHtml(r.name)}</b><br>${escapeHtml(todayText)}${tomorrowText ? "<br>" + escapeHtml(tomorrowText) : ""}`);
  });
}

async function analyze() {

    ? ` ${state.photos.length} photos sont fournies (différents angles ou zones de la même plante) : croise-les pour affiner ton diagnostic.`

    : "Aucune fiche de référence disponible pour cette culture.";

  const regionData = (state.meteo.data || []).find((r) => r.name === state.diagnosticRegion);
  let weatherContext = `Zone sélectionnée : ${state.diagnosticRegion}. Données météo non disponibles actuellement.`;

    const d = describeRainDay(regionData.tomorrow, "Demain");
    weatherContext = `Zone sélectionnée : ${state.diagnosticRegion}. ${t.text}. ${d.text}.`;
  }

  const prompt = `Tu es un agronome expert des cultures d'Afrique de l'Ouest, en particulier de la région de Kaolack au Sénégal. Analyse cette (ou ces) photo(s) de feuille de ${cropLabel}.${multiNote}

BASE DE RÉFÉRENCE LOCALE (maladies/ravageurs déjà documentés pour ${cropLabel} au Sénégal) — utilise-la en priorité pour nommer et qualifier la maladie si les symptômes correspondent. Si les symptômes observés ne correspondent clairement à aucune de ces fiches, tu peux proposer un autre diagnostic agronomique plausible mais indique alors "correspond_base_locale": false :
${knowledgeBase}

CONTEXTE MÉTÉO DE LA ZONE (à utiliser pour dater/adapter le plan de traitement — un traitement pulvérisé juste avant une forte pluie est lessivé et inefficace, une pluie imminente favorise aussi certains champignons) :
${weatherContext}

Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ni après, sans balises markdown, au format exact suivant :
{"maladie": "nom de la maladie ou 'Aucune anomalie détectée'", "correspond_base_locale": true|false, "confiance": nombre entre 0 et 100, "gravite": "Faible" | "Modérée" | "Élevée", "stade": "Précoce" | "Modéré" | "Avancé" | "Non applicable", "surface_atteinte_pct": nombre entre 0 et 100, "diagnostic_differentiel": [{"maladie": "autre hypothèse plausible", "probabilite": nombre entre 0 et 100}], "symptomes": "description courte des symptômes observés en français", "traitement": "recommandation de traitement pratique et accessible localement", "prevention": "conseil de prévention court", "urgence": "Immédiate" | "Sous 48h" | "Surveillance", "conseil_meteo": "une phrase reliant le moment d'application du traitement à la météo de la zone (ex: 'Traiter avant 15h, pluie prévue ensuite qui lessiverait le produit' ou 'Aucune pluie prévue : bonne fenêtre pour traiter aujourd'hui')", "plan_traitement": [{"jour": 0, "action": "action précise à réaliser", "produit": "produit ou remède local (ex: bouillie bordelaise, extrait de neem, taille des feuilles atteintes)"}], "gravite_si_non_traite": "conséquence courte si aucun traitement n'est appliqué"}

diagnostic_differentiel doit contenir 0 à 2 hypothèses alternatives seulement si un doute réel existe (liste vide si le diagnostic est clair). Le plan_traitement doit contenir entre 3 et 5 étapes concrètes et réalisables avec des moyens disponibles localement (produits phytosanitaires courants au Sénégal ou remèdes naturels), échelonnées sur les jours suivant le diagnostic (jour 0 = aujourd'hui), et doit tenir compte du contexte météo fourni. Si aucune maladie n'est détectée, propose un plan de surveillance léger plutôt qu'un traitement et mets "urgence": "Surveillance".`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [
          {
            role: "user",
            content: [
              ...state.photos.map((p) => ({ type: "image", source: { type: "base64", media_type: p.mediaType, data: p.base64 } })),
              { type: "text", text: prompt },
            ],
          },
        ],
      }),
    });
    const data = await response.json();
    const textBlock = (data.content || []).find((b) => b.type === "text");
    if (!textBlock) throw new Error("Réponse vide du modèle");
    const clean = textBlock.text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);
    state.result = parsed;
    state.status = "done";
    const entry = {
      ...parsed,
      crop: cropLabel,
      cropId: state.crop,
      region: state.diagnosticRegion,
      time: new Date().toLocaleString("fr-FR"),
      preview: state.photos[0].previewUrl,
      photoCount: state.photos.length,
      planProgress: {},
    };
    persistHistory([entry, ...state.history].slice(0, 20));
  } catch (err) {
    state.status = "error";
    state.errorMsg = "L'analyse n'a pas abouti. Vérifiez la ou les photos et réessayez.";
    render();
  }
}
async function copyReport() {
  if (!state.result) return;
  const cropLabel = (CROPS.find((c) => c.id === state.crop) || {}).label || state.crop;
  const r = state.result;
  const planText = Array.isArray(r.plan_traitement) && r.plan_traitement.length
    ? "\nPlan de traitement :\n" + r.plan_traitement.map((s) => `- ${dayLabel(s.jour)} : ${s.action}${s.produit ? ` (${s.produit})` : ""}`).join("\n")
    : "";
  const diffText = Array.isArray(r.diagnostic_differentiel) && r.diagnostic_differentiel.length
    ? `\nAutres hypothèses : ${r.diagnostic_differentiel.map((h) => `${h.maladie} (${h.probabilite}%)`).join(", ")}`
    : "";
  const text = `RAPPORT AGROSCAN — ${cropLabel} (${state.diagnosticRegion})
Diagnostic : ${r.maladie} (confiance ${r.confiance}%, gravité ${r.gravite}${r.urgence ? `, urgence ${r.urgence}` : ""})
${r.stade ? `Stade : ${r.stade}` : ""}${r.surface_atteinte_pct != null ? ` — Surface atteinte estimée : ${r.surface_atteinte_pct}%` : ""}
Symptômes : ${r.symptomes}
Traitement : ${r.traitement}${diffText}
Prévention : ${r.prevention}${planText}${r.conseil_meteo ? `\nConseil météo : ${r.conseil_meteo}` : ""}
Conditions au moment du scan : humidité ${SENSOR.humidity}%, température ${SENSOR.temp}°C, sol ${SENSOR.soil}%`;
  try {
    await navigator.clipboard.writeText(text);
    state.copied = true;
    render();
    setTimeout(() => { state.copied = false; render(); }, 2000);
  } catch (e) {
    // clipboard unavailable — ignore
  }
}

  if (u === "Sous 48h") return "var(--gold)";
  return "var(--leaf)";
}

function renderSalinityTerrain() {
  const s = state.salinity;
  const regions = salinityRegions();
  const deps = s.region ? salinityDepartements(s.region) : [];
  const communes = s.region && s.departement ? salinityCommunes(s.region, s.departement) : [];
  const cultures = s.region && s.departement && s.commune ? salinityCultures(s.region, s.departement, s.commune) : [];
  const records = s.region && s.departement && s.commune ? salinityFieldRecords(s.region, s.departement, s.commune, s.culture) : [];

  const selectRow = (label, value, options, onAttr, disabled) => `
    <div style="margin-bottom:14px">
      <div class="field-label">${label}</div>
      <select data-${onAttr} ${disabled ? "disabled" : ""} style="width:100%;background:rgba(239,231,211,0.04);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--cream);font-size:14px;font-family:inherit">
        <option value="">${disabled ? "—" : "Choisir…"}</option>
        ${options.map((o) => `<option value="${escapeHtml(o)}" ${o === value ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
      </select>
    </div>
  `;

  return `
    ${selectRow("Région", s.region, regions, "salinity-region", false)}
    ${selectRow("Département", s.departement, deps, "salinity-dept", !s.region)}
    ${selectRow("Commune", s.commune, communes, "salinity-commune", !s.departement)}
    ${selectRow("Culture (optionnel — filtre les mesures)", s.culture, cultures, "salinity-culture", !s.commune)}

    ${!s.commune ? `<div class="disease-empty">Sélectionnez une région, un département puis une commune pour afficher les mesures de terrain disponibles.</div>` : ""}

    ${s.commune && records.length === 0 ? `<div class="disease-empty">Aucune mesure enregistrée pour cette combinaison commune/culture.</div>` : ""}

    ${records.length > 0 ? `
      <div class="disease-list">
        ${records.map((r) => `
          <div class="disease-card open">
            <div class="disease-head" style="cursor:default">
              <div style="flex:1">
                <div class="disease-name">${escapeHtml(r.cu)} · ${escapeHtml(r.c)}</div>
                <div class="disease-type">Mesure du ${escapeHtml(r.dt)}</div>
              </div>
              <span class="severity-tag" style="border-color:${priorityColor(r.p)};color:${priorityColor(r.p)}">${escapeHtml(r.p)}</span>
            </div>
            <div class="disease-body">
              <div><div class="field-label">EC mesurée</div><div class="field-value">${r.ec} dS/m</div></div>
              <div><div class="field-label">Cause principale</div><div class="field-value">${escapeHtml(r.ca)}</div></div>
              <div><div class="field-label">${ICONS.sprout("#C9A227")} Recommandation</div><div class="field-value">${escapeHtml(r.re)}${r.do && r.do !== "—" ? ` · ${escapeHtml(r.do)}` : ""}</div></div>

  `;
}

  return `

      ${Object.keys(SALINITY_CROPS).map((id) => `<button class="chip ${id === s.crop ? "active" : ""}" data-salinity-crop="${id}">${SALINITY_CROPS[id].label}</button>`).join("")}

function bindEvents() {
  document.querySelectorAll("[data-tab]").forEach((el) => {
    el.addEventListener("click", () => setActiveTab(el.getAttribute("data-tab")));
  });
  document.querySelectorAll("[data-crop]").forEach((el) => {
    el.addEventListener("click", () => setCrop(el.getAttribute("data-crop")));
  });
  document.querySelectorAll("[data-region]").forEach((el) => {
    el.addEventListener("click", () => setDiagnosticRegion(el.getAttribute("data-region")));
  });
  document.querySelectorAll("[data-remove]").forEach((el) => {
    el.addEventListener("click", () => removePhoto(parseInt(el.getAttribute("data-remove"), 10)));
  });
  document.querySelectorAll("[data-plan-step]").forEach((el) => {
    el.addEventListener("click", () => togglePlanStep(parseInt(el.getAttribute("data-plan-step"), 10)));
  });
  document.querySelectorAll("[data-encyclo-crop]").forEach((el) => {
    el.addEventListener("click", () => setEncycloCrop(el.getAttribute("data-encyclo-crop")));
  });
  document.querySelectorAll("[data-salinity-crop]").forEach((el) => {
    el.addEventListener("click", () => setSalinityCrop(el.getAttribute("data-salinity-crop")));
  });
  document.querySelectorAll("[data-salinity-mode]").forEach((el) => {
    el.addEventListener("click", () => setSalinityMode(el.getAttribute("data-salinity-mode")));
  });
  const salinityEc = document.getElementById("salinity-ec");
  if (salinityEc) salinityEc.addEventListener("input", (e) => setSalinityEc(e.target.value));
  const salinityRegionSel = document.querySelector("[data-salinity-region]");
  if (salinityRegionSel) salinityRegionSel.addEventListener("change", (e) => setSalinityRegion(e.target.value));
  const salinityDeptSel = document.querySelector("[data-salinity-dept]");
  if (salinityDeptSel) salinityDeptSel.addEventListener("change", (e) => setSalinityDept(e.target.value));
  const salinityCommuneSel = document.querySelector("[data-salinity-commune]");
  if (salinityCommuneSel) salinityCommuneSel.addEventListener("change", (e) => setSalinityCommune(e.target.value));
  const salinityCultureSel = document.querySelector("[data-salinity-culture]");
  if (salinityCultureSel) salinityCultureSel.addEventListener("change", (e) => setSalinityCulture(e.target.value));
  document.querySelectorAll("[data-encyclo-toggle]").forEach((el) => {
    el.addEventListener("click", () => toggleEncyclo(parseInt(el.getAttribute("data-encyclo-toggle"), 10)));
  });
  const encycloSearch = document.getElementById("encyclo-search");
  if (encycloSearch) {
    encycloSearch.addEventListener("input", (e) => setEncycloSearch(e.target.value, e.target.selectionStart));
    encycloSearch.addEventListener("blur", () => { state.encyclo._focused = false; });
    if (state.encyclo._focused) {
      encycloSearch.focus();
      const pos = state.encyclo._caret != null ? state.encyclo._caret : encycloSearch.value.length;
      encycloSearch.setSelectionRange(pos, pos);
    }
  }
  const fileInput = document.getElementById("file-input");
  const dropZone = document.getElementById("drop-zone");
  const addMore = document.getElementById("add-more");
  if (fileInput) fileInput.addEventListener("change", (e) => handleFiles(e.target.files));
  if (dropZone) {
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("keydown", (e) => { if (e.key === "Enter") fileInput.click(); });
    dropZone.addEventListener("dragover", (e) => e.preventDefault());
    dropZone.addEventListener("drop", (e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); });
  }
  if (addMore) addMore.addEventListener("click", () => fileInput.click());
  const analyzeBtn = document.getElementById("analyze-btn");
  if (analyzeBtn) analyzeBtn.addEventListener("click", analyze);
  const resetBtn = document.getElementById("reset-btn");
  if (resetBtn) resetBtn.addEventListener("click", resetAll);
  const copyBtn = document.getElementById("copy-btn");
  if (copyBtn) copyBtn.addEventListener("click", copyReport);
  const fbUp = document.getElementById("fb-up");
  if (fbUp) fbUp.addEventListener("click", () => setFeedback("up"));
  const fbDown = document.getElementById("fb-down");
  if (fbDown) fbDown.addEventListener("click", () => setFeedback("down"));
  const meteoRefresh = document.getElementById("meteo-refresh");
  if (meteoRefresh) meteoRefresh.addEventListener("click", loadMeteo);
  const radarPlay = document.getElementById("radar-play");
  if (radarPlay) radarPlay.addEventListener("click", toggleRadarPlay);
  const radarSlider = document.getElementById("radar-slider");
  if (radarSlider) radarSlider.addEventListener("input", (e) => setRadarIndex(parseInt(e.target.value, 10)));
  if (state.activeTab === "meteo") initMap();

  /* Paramètres */
  const notifToggle = document.getElementById("settings-notif-toggle");
  if (notifToggle) notifToggle.addEventListener("click", toggleNotifications);
  const logoutBtn = document.getElementById("settings-logout-btn");
  if (logoutBtn) logoutBtn.addEventListener("click", handleLogout);

  /* Cartographie nationale */
  const cartoRegionSel = document.querySelector("[data-carto-region]");
  if (cartoRegionSel) cartoRegionSel.addEventListener("change", (e) => cartoSetRegion(e.target.value));
  const cartoDeptSel = document.querySelector("[data-carto-dept]");
  if (cartoDeptSel) cartoDeptSel.addEventListener("change", (e) => cartoSetDept(e.target.value));
  const cartoArrSel = document.querySelector("[data-carto-arr]");
  if (cartoArrSel) cartoArrSel.addEventListener("change", (e) => cartoSetArr(e.target.value));
  const cartoCommuneSel = document.querySelector("[data-carto-commune]");
  if (cartoCommuneSel) cartoCommuneSel.addEventListener("change", (e) => cartoSetCommune(e.target.value));
  const cartoVillageSel = document.querySelector("[data-carto-village]");
  if (cartoVillageSel) cartoVillageSel.addEventListener("change", (e) => cartoSetVillage(e.target.value));
  const cartoScanBtn = document.getElementById("carto-scan-btn");
  if (cartoScanBtn) cartoScanBtn.addEventListener("click", cartoRunScan);
  const cartoAddVillageToggle = document.getElementById("carto-add-village-toggle");
  if (cartoAddVillageToggle) cartoAddVillageToggle.addEventListener("click", cartoToggleAddVillage);
  const cvName = document.getElementById("carto-village-name");
  if (cvName) cvName.addEventListener("input", (e) => cartoSetNewVillageField("name", e.target.value));
  const cvLat = document.getElementById("carto-village-lat");
  if (cvLat) cvLat.addEventListener("input", (e) => cartoSetNewVillageField("lat", e.target.value));
  const cvLon = document.getElementById("carto-village-lon");
  if (cvLon) cvLon.addEventListener("input", (e) => cartoSetNewVillageField("lon", e.target.value));
  const cvSubmit = document.getElementById("carto-village-submit");
  if (cvSubmit) cvSubmit.addEventListener("click", cartoSubmitVillage);
  const cartoAlertBtn = document.getElementById("carto-alert-btn");
  if (cartoAlertBtn) cartoAlertBtn.addEventListener("click", cartoSendAlert);
  const cartoExportPdfBtn = document.getElementById("carto-export-pdf");
  if (cartoExportPdfBtn) cartoExportPdfBtn.addEventListener("click", cartoExportPdf);
  const cartoExportExcelBtn = document.getElementById("carto-export-excel");
  if (cartoExportExcelBtn) cartoExportExcelBtn.addEventListener("click", cartoExportExcel);
  if (state.activeTab === "cartographie") initCartoMap();
}

let cartoLeafletMap = null;
function initCartoMap() {
  const container = document.getElementById("carto-map");
  if (!container || typeof L === "undefined") return;
  if (cartoLeafletMap) { try { cartoLeafletMap.remove(); } catch (e) {} cartoLeafletMap = null; }
  cartoLeafletMap = L.map(container, { center: [14.4974, -14.4524], zoom: 6.4, zoomControl: true, attributionControl: false });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { maxZoom: 12, subdomains: "abcd" }).addTo(cartoLeafletMap);
  REGIONS.forEach((region) => {
    const seed = hashSeed(region.name + ":region-risk");
    const ec = +(1 + seededRandom(seed)() * 10).toFixed(1);
    const color = cartoRiskFromEc(ec).color;
    const marker = L.circleMarker([region.lat, region.lon], { radius: 10, color, fillColor: color, fillOpacity: 0.8, weight: 1.5 }).addTo(cartoLeafletMap);
    marker.bindPopup(`<b>${escapeHtml(region.name)}</b><br>Salinité moyenne estimée : ${ec} dS/m`);
    marker.on("click", () => cartoPickRegionFromMap(region.name));
  });
  if (state.carto.scan) {
    const key = state.carto.scan.locationKey;
    const region = REGIONS.find((r) => r.name === state.carto.region);
    if (region) {
      const jitter = seededRandom(hashSeed(key));
      const lat = region.lat + (jitter() - 0.5) * 0.3;
      const lon = region.lon + (jitter() - 0.5) * 0.3;
      const s = state.carto.scan;
      L.circle([lat, lon], { radius: Math.sqrt(s.superficie) * 60, color: s.risk.color, fillColor: s.risk.color, fillOpacity: 0.35, weight: 2 })
        .addTo(cartoLeafletMap)
        .bindPopup(`<b>${escapeHtml(state.carto.commune)}</b><br>EC : ${s.ec} dS/m · ${s.superficie} ha touchés`);
    }
  }
}

async function loadSettings() {
  try {
    const res = await window.storage.get("agroscan:settings", false);
    if (res && res.value) state.settings = { ...state.settings, ...JSON.parse(res.value) };
  } catch (e) { /* réglages par défaut */ }
}

render();
checkSession();
loadSettings();
loadHistory();
loadMeteo();
loadRadar();
</script>
