// ---------------------------------------------------------------------------
// Repli local pour window.storage — l'API de stockage persistant fournie par
// Claude n'existe que dans le runtime Artifacts. Si ce fichier est ouvert
// autrement (fichier HTML autonome, hébergement statique, aperçu hors Claude),
// window.storage est absent : sans ce repli, TOUT ce qui en dépend échouerait
// silencieusement, y compris la connexion à l'espace agent.
//
// Ce repli persiste réellement dans localStorage (et non plus seulement en
// mémoire) : l'activation de l'espace agent, les codes d'accès et le statut
// des signalements survivent donc à un rechargement de page ou à la fermeture
// de l'onglet sur ce même navigateur — condition nécessaire pour qu'une
// démonstration autonome (hors Claude) soit réellement opérationnelle.
// Limite assumée : localStorage est propre à un navigateur/appareil, donc la
// portée "partagée" (shared=true) reste locale à ce poste et n'est pas
// synchronisée entre plusieurs ordinateurs — contrairement à window.storage
// dans le runtime Artifacts, qui, lui, est un vrai backend partagé. Si
// localStorage est indisponible (navigation privée stricte, quota dépassé),
// on se replie silencieusement sur une Map en mémoire pour que l'app reste
// utilisable pendant la session.
if (typeof window.storage === "undefined") {
  const QN_LS_PREFIX = "qn-storage::";
  const qnMemoryStore = new Map();
  let qnLocalStorageOK = false;
  try {
    const probeKey = "__qn_storage_probe__";
    window.localStorage.setItem(probeKey, "1");
    window.localStorage.removeItem(probeKey);
    qnLocalStorageOK = true;
  } catch {
    qnLocalStorageOK = false; // navigation privée, quota dépassé, ou API indisponible
  }
  const qnScopedKey = (key, shared) => (shared ? "shared:" : "personal:") + key;
  const qnRawGet = (k) => {
    if (qnLocalStorageOK) {
      const v = window.localStorage.getItem(QN_LS_PREFIX + k);
      return v === null ? undefined : v;
    }
    return qnMemoryStore.get(k);
  };
  const qnRawHas = (k) => {
    if (qnLocalStorageOK) return window.localStorage.getItem(QN_LS_PREFIX + k) !== null;
    return qnMemoryStore.has(k);
  };
  const qnRawSet = (k, value) => {
    if (qnLocalStorageOK) {
      try {
        window.localStorage.setItem(QN_LS_PREFIX + k, value);
        return;
      } catch {
        /* quota dépassé (ex: trop de photos) — repli mémoire pour cette écriture */
      }
    }
    qnMemoryStore.set(k, value);
  };
  const qnRawDelete = (k) => {
    let existed = qnRawHas(k);
    if (qnLocalStorageOK) window.localStorage.removeItem(QN_LS_PREFIX + k);
    if (qnMemoryStore.has(k)) existed = true;
    qnMemoryStore.delete(k);
    return existed;
  };
  const qnRawKeys = () => {
    const keys = new Set();
    if (qnLocalStorageOK) {
      for (let i = 0; i < window.localStorage.length; i++) {
        const full = window.localStorage.key(i);
        if (full && full.startsWith(QN_LS_PREFIX)) keys.add(full.slice(QN_LS_PREFIX.length));
      }
    }
    qnMemoryStore.forEach((_, k) => keys.add(k));
    return Array.from(keys);
  };
  window.storage = {
    async get(key, shared) {
      const k = qnScopedKey(key, shared);
      if (!qnRawHas(k)) throw new Error("qn-storage: clé introuvable");
      return { key, value: qnRawGet(k), shared: !!shared };
    },
    async set(key, value, shared) {
      qnRawSet(qnScopedKey(key, shared), value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      const existed = qnRawDelete(qnScopedKey(key, shared));
      return { key, deleted: existed, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = qnScopedKey(prefix || "", shared);
      const keys = qnRawKeys()
        .filter((k) => k.startsWith(p))
        .map((k) => k.slice(k.indexOf(":") + 1));
      return { keys, prefix, shared: !!shared };
    },
  };
}

// ---------------------------------------------------------------------------
// Intégration du backend de notification (voir sen-collecte-notif-backend.zip
// et Sen-Collecte-Notifications.docx pour le détail de la conception).
//
// Laissez NOTIFICATION_API_BASE_URL vide ("") pour désactiver silencieusement
// les notifications (comportement actuel de la démo — seul le toast visuel
// s'affiche). Renseignez-le avec l'URL du backend déployé (ex :
// "https://notif.sen-collecte.sn") pour activer les vrais envois SMS.
// ---------------------------------------------------------------------------
const NOTIFICATION_API_BASE_URL = "";

async function notifyBackend(path, payload) {
  if (!NOTIFICATION_API_BASE_URL) return { skipped: true };
  try {
    const res = await fetch(NOTIFICATION_API_BASE_URL + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (err) {
    // Une notification manquée ne doit jamais bloquer l'expérience du citoyen
    // ou de l'agent : on journalise seulement dans la console.
    console.warn("[notification] échec de l'envoi :", err.message);
    return { skipped: true, error: err.message };
  }
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("read-failed"));
    reader.readAsDataURL(file);
  });
}

// Recompresse une image côté client (canvas) avant stockage : limite la taille
// des valeurs persistées et accélère l'affichage du fil.
function compressImage(file, maxDim = 1000, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read-failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode-failed"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Horodatage relatif, recalculé à l'affichage (voir l'intervalle `tick`)
function timeAgo(ts) {
  if (!ts) return "";
  const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (diffSec < 45) return "à l'instant";
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `il y a ${diffMin} min`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `il y a ${diffH} h`;
  const diffJ = Math.floor(diffH / 24);
  if (diffJ === 1) return "hier";
  if (diffJ < 7) return `il y a ${diffJ} j`;
  return new Date(ts).toLocaleDateString("fr-FR");
}

// Formate une durée en millisecondes en "X j Y h" (ou "Y h" si < 1 jour)
function formatDuration(ms) {
  const totalHours = Math.max(0, Math.round(ms / 3600000));

  const hours = totalHours % 24;
  if (days === 0) return `${hours} h`;

}

// --- Projection GPS -> SVG (équirectangulaire simple, bornes des 5 régions) ---
const LAT_MIN = 13.6, LAT_MAX = 16.75, LON_MIN = -17.55, LON_MAX = -14.85;
const MAP_W = 380, MAP_H = 430, PAD = 40;
function project(lat, lon) {
  const x = PAD + ((lon - LON_MIN) / (LON_MAX - LON_MIN)) * (MAP_W - 2 * PAD);
  const y = PAD + ((LAT_MAX - lat) / (LAT_MAX - LAT_MIN)) * (MAP_H - 2 * PAD);
  return { x, y };
}

// Bornes locales pour l'inset Dakar (départements très rapprochés)
const DK_LAT_MIN = 14.66, DK_LAT_MAX = 14.80, DK_LON_MIN = -17.47, DK_LON_MAX = -17.24;
const DK_W = 210, DK_H = 150, DK_PAD = 26;
function projectDakar(lat, lon) {
  const x = DK_PAD + ((lon - DK_LON_MIN) / (DK_LON_MAX - DK_LON_MIN)) * (DK_W - 2 * DK_PAD);
  const y = DK_PAD + ((DK_LAT_MAX - lat) / (DK_LAT_MAX - DK_LAT_MIN)) * (DK_H - 2 * DK_PAD);
  return { x, y };
}

// Graphique en barres maison — même langage visuel « SVG dessiné à la main »
// que la carte GPS, sans dépendance externe (remplace recharts).
// ---------------------------------------------------------------------------
function BarChartCustom({ data, layout, color, onBarClick }) {
  const [hovered, setHovered] = useState(null);
  if (!data || !data.length) return null;
  const max = Math.max(1, ...data.map((d) => d.val));

  if (layout === "cat") {
    // Barres verticales (répartition par catégorie)
    const W = 100, H = 100, gap = 4, barW = (W - gap * (data.length - 1)) / data.length;
    return (
      <svg viewBox={`0 0 ${W} ${H + 14}`} width="100%" height="100%" preserveAspectRatio="none" style={{ overflow: "visible" }}>
        {[0.25, 0.5, 0.75, 1].map((f) => (
          <line key={f} x1="0" x2={W} y1={H * (1 - f)} y2={H * (1 - f)} stroke="#EDEEE6" strokeWidth="0.5" />
        ))}
        {data.map((d, i) => {
          const h = (d.val / max) * H;
          const x = i * (barW + gap);
          const isHover = hovered === i;
          return (
            <g key={d.name} onClick={() => onBarClick(d)} onMouseEnter={() => setHovered(i)} onMouseLeave={() => setHovered(null)} style={{ cursor: "pointer" }}>
              <title>{`${d.name} : ${d.val}`}</title>
              <rect x={x} y={H - h} width={barW} height={Math.max(h, 1)} rx={1.6} fill={color} opacity={isHover ? 0.82 : 1} />
            </g>
          );
        })}
        {data.map((d, i) => {
          const x = i * (barW + gap) + barW / 2;
          return (
            <text key={d.name} x={x} y={H + 9} fontSize="3.6" textAnchor="middle" fill="#8452C8" fontFamily="'Public Sans', sans-serif">
              {d.name}
            </text>
          );
        })}
      </svg>
    );
  }

  // Barres horizontales (par région ou par département)
  const rowH = 100 / data.length;
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", justifyContent: "space-between" }}>
      {data.map((d, i) => {
        const pct = Math.max(3, (d.val / max) * 100);
        const isHover = hovered === i;
        return (
          <div
            key={d.name}
            onClick={() => onBarClick(d)}
            onMouseEnter={() => setHovered(i)}
            onMouseLeave={() => setHovered(null)}
            style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", height: `${rowH}%` }}
          >
            <span style={{ width: 78, fontSize: 10.5, color: "#8452C8", flexShrink: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.name}</span>
            <div style={{ flex: 1, background: "#F1E8D2", borderRadius: 5, overflow: "hidden", height: 12 }}>
              <div style={{ width: `${pct}%`, height: "100%", background: color, opacity: isHover ? 0.82 : 1, borderRadius: 5, transition: "width .25s ease, opacity .15s ease" }} />
            </div>
            <span style={{ width: 20, fontSize: 10.5, color: "#6f776f", textAlign: "right", flexShrink: 0, fontFamily: "'IBM Plex Mono', monospace" }}>{d.val}</span>
          </div>
        );
      })}
    </div>
  );
}

// Piège de focus minimal pour les fenêtres modales : garde le Tab/Shift+Tab
// à l'intérieur du conteneur tant que la modale est ouverte, et rétablit le
// focus initial une fois refermée — indispensable pour la navigation clavier
// et les lecteurs d'écran (les clics/Échap seuls ne suffisent pas).
function useFocusTrap(containerRef, active) {
  useEffect(() => {
    if (!active || !containerRef.current) return;
    const container = containerRef.current;
    const selector = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    const getFocusable = () => Array.from(container.querySelectorAll(selector)).filter((el) => el.offsetParent !== null);
    const focusables = getFocusable();
    if (focusables.length && !container.contains(document.activeElement)) focusables[0].focus();
    function onKeyDown(e) {
      if (e.key !== "Tab") return;
      const items = getFocusable();
      if (!items.length) return;
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
    container.addEventListener("keydown", onKeyDown);
    return () => container.removeEventListener("keydown", onKeyDown);
  }, [active, containerRef]);
}

// Verrouille le défilement de l'arrière-plan pendant qu'une modale plein écran
// est ouverte — évite le "scroll fantôme" derrière la fenêtre sur mobile.
function useBodyScrollLock(active) {
  useEffect(() => {
    if (!active) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      document.body.style.overflow = prev;
    };
  }, [active]);
}

  const gpsHeaderWatchRef = useRef(null);

  function requestPreciseGPS() {
    if (!("geolocation" in navigator)) {
      setGpsStatus("unsupported");
      return;
    }
    setGpsStatus("locating");
    setGpsFix(null);
    if (gpsWatchRef.current) navigator.geolocation.clearWatch(gpsWatchRef.current);
    let bestAccuracy = Infinity;
    gpsWatchRef.current = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, accuracy, speed, heading, altitude } = pos.coords;
        // Simule le nombre de "fixes" satellites en fonction de la précision obtenue —
        // reflète visuellement la convergence progressive du signal (comme une
        // constellation LEO dense qui affine sa triangulation en quelques secondes).
        const satFixes = accuracy <= 8 ? 9 : accuracy <= 15 ? 7 : accuracy <= 30 ? 5 : 3;
        if (accuracy <= bestAccuracy) {
          bestAccuracy = accuracy;
          setGpsFix({ lat: latitude, lon: longitude, accuracy, speed, heading, altitude, satFixes, ts: pos.timestamp });
        }
        setGpsStatus("locked");
      },
      (err) => {
        setGpsStatus("denied");
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
    // Coupe le suivi haute fréquence après verrouillage stable pour préserver la batterie.
    setTimeout(() => {
      if (gpsWatchRef.current) {
        navigator.geolocation.clearWatch(gpsWatchRef.current);
        gpsWatchRef.current = null;
      }
    }, 12000);
  }

  function stopPreciseGPS() {
    if (gpsWatchRef.current) {
      navigator.geolocation.clearWatch(gpsWatchRef.current);
      gpsWatchRef.current = null;
    }
    setGpsStatus("idle");
    setGpsFix(null);
  }

  // Badge d'en-tête : un fix léger (faible fréquence) pour afficher un statut
  // satellite "vivant" en permanence sans consommer la batterie inutilement.
  useEffect(() => {
    if (!("geolocation" in navigator)) return;
    gpsHeaderWatchRef.current = navigator.geolocation.watchPosition(
      (pos) => setGpsHeaderFix({ accuracy: pos.coords.accuracy, ts: pos.timestamp }),
      () => setGpsHeaderFix(null),
      { enableHighAccuracy: true, maximumAge: 20000, timeout: 20000 }
    );
    return () => {
      if (gpsHeaderWatchRef.current) navigator.geolocation.clearWatch(gpsHeaderWatchRef.current);
    };
  }, []);

  // Anti-rebond de la recherche : le filtrage (et le re-rendu du fil) n'est
  // recalculé que 250 ms après la dernière frappe, plutôt qu'à chaque
  // caractère saisi — évite les à-coups sur de longues listes / mobile bas de gamme.
  useEffect(() => {

    return () => clearTimeout(t);

  const counts = useMemo(() => {

  const visibleReports = useMemo(() => {
    let list = reports;
    if (selectedDept) list = list.filter((r) => r.dept === selectedDept);

    if (filter !== "tous") list = list.filter((r) => r.status === filter);
    if (categoryFilter !== "tous") list = list.filter((r) => r.cat === categoryFilter);
    if (debouncedSearch.trim()) {
      const q = debouncedSearch.trim().toLowerCase();
      list = list.filter(
        (r) =>
          r.id.toLowerCase().includes(q) ||
          r.dept.toLowerCase().includes(q) ||
          r.region.toLowerCase().includes(q) ||
          (r.lieu || "").toLowerCase().includes(q) ||
          catMeta(r.cat).label.toLowerCase().includes(q) ||
          STATUS_META[r.status].label.toLowerCase().includes(q)
      );
    }
    // Tri explicite : "recent" ne doit pas dépendre de l'ordre d'insertion
    // (fragile dès que les données viennent d'un backend partagé où l'ordre
    // n'est pas garanti) — on trie toujours par date de création.
    list = [...list].sort((a, b) => (sortBy === "votes" ? b.votes - a.votes : b.createdAt - a.createdAt));
    return list;
  }, [reports, filter, categoryFilter, debouncedSearch, sortBy, selectedRegion, selectedDept]);

  const pagedReports = visibleReports.slice(0, visibleCount);

  useEffect(() => {

  const chartData = useMemo(() => {
    if (selectedDept) {
      const base = { depot: 0, drain: 0, poubelle: 0, autre: 0 };
      reports.filter((r) => r.dept === selectedDept).forEach((r) => (base[r.cat] += 1));
      return { data: CATEGORIES.map((c) => ({ name: c.label.split(" ")[0], val: base[c.id], id: c.id })), layout: "cat" };
    }
    if (selectedRegion) {
      return { data: deptsOf(selectedRegion).map((d) => ({ name: d.name, val: deptVolume[d.name] || 0 })), layout: "region" };
    }
    return { data: REGIONS.map((r) => ({ name: r, val: regionVolume[r] })), layout: "national" };
  }, [selectedRegion, selectedDept, reports]);

  const resolutionStats = useMemo(() => {
    if (!reports.length) return null;
    const resolved = reports.filter((r) => r.status === "resolu" && r.resolvedAt);
    const rate = Math.round((reports.filter((r) => r.status === "resolu").length / reports.length) * 100);
    if (!resolved.length) return { avgLabel: null, rate, n: 0 };
    const avgMs = resolved.reduce((sum, r) => sum + (r.resolvedAt - r.createdAt), 0) / resolved.length;
    return { avgLabel: formatDuration(avgMs), rate, n: resolved.length };
  }, [reports]);

  function openForm(region, dept) {
    const r = region || selectedRegion || "Dakar";
    const dd = dept || (deptsOf(r)[0] && deptsOf(r)[0].name) || "Dakar";
    setForm({ cat: "depot", region: r, dept: dd, lieu: "", photo: null, telephone: "" });

  async function submitReport(e) {
    e.preventDefault();
    if (submitting) return;
    setSubmitting(true);
    const id = "SC-" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 4).toUpperCase();
    const createdAt = Date.now();
    const hasPhoto = !!form.photo;
    const newReport = {
      id, region: form.region, dept: form.dept, cat: form.cat, status: "nouveau",
      createdAt, votes: 1, lieu: form.lieu.trim() || null, hasPhoto, photo: form.photo || null,
      telephone: form.telephone.trim() || null,
      gps: gpsFix ? { lat: gpsFix.lat, lon: gpsFix.lon, accuracy: gpsFix.accuracy, satFixes: gpsFix.satFixes } : null,
    };
    const updated = [newReport, ...reports];
    setReports(updated);
    if (hasPhoto) photoCacheRef.current.set(id, form.photo);
    setShowForm(false);
    stopPreciseGPS();
    toastMsg(`Signalement ${id} envoyé — ${form.dept} (${form.region}) notifié.`, 3800);
    setSyncing(true);
    const [indexOk, photoOk] = await Promise.all([
      storageSaveIndex(updated),
      hasPhoto ? storageSavePhoto(id, form.photo) : Promise.resolve(true),
    ]);
    setSyncing(false);
    setSubmitting(false);
    if (!indexOk) {
      toastMsg("Enregistré sur cet appareil — synchronisation impossible pour l'instant.", 3400);
    } else if (hasPhoto && !photoOk) {
      // Corrige un manquement connu : l'échec de sauvegarde photo (quota dépassé,
      // navigation privée...) était auparavant silencieux. Le signalement reste
      // valide, mais on prévient explicitement que la photo n'a pas pu être conservée.
      toastMsg("Signalement envoyé, mais la photo n'a pas pu être conservée (espace de stockage plein).", 4200);
    }
    // Notifie l'agent du département concerné (et enregistre le contact
    // citoyen s'il a été fourni, pour la notification de suivi de statut).
    notifyBackend("/api/notifications/nouveau-signalement", {
      reportId: id, departement: form.dept, region: form.region,
      telephoneCitoyen: form.telephone.trim() || undefined,
    });
    logNotification({
      to: `Agent · ${form.dept}`,
      recipientLabel: "agent",
      message: `Sen-Collecte : nouveau signalement ${id} à traiter (${form.dept}, ${form.region}).`,
    });
    if (form.telephone.trim()) {
      logNotification({
        to: form.telephone.trim(),
        recipientLabel: "citoyen",
        message: `Sen-Collecte : votre signalement ${id} a bien été reçu. Vous serez notifié de son suivi.`,
      });
    }
  }
  async function readPhotoFile(file) {
    if (!file) return;
    if (!file.type || !file.type.startsWith("image/")) {
      toastMsg("Format non pris en charge — choisissez une image.");
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      toastMsg("Photo trop lourde (max 8 Mo).");
      return;
    }
    setPhotoProcessing(true);
    try {
      let dataUrl;
      try {
        dataUrl = await compressImage(file);
      } catch {
        // Repli : si la compression échoue (canvas indisponible, format inhabituel...),
        // on utilise l'image telle quelle plutôt que de bloquer l'ajout de la photo.
        dataUrl = await readFileAsDataURL(file);
      }
      setForm((f) => ({ ...f, photo: dataUrl }));
    } catch {
      toastMsg("Impossible de lire cette photo. Réessayez.");
    } finally {
      setPhotoProcessing(false);
    }
  }
  function handlePhoto(e) {
    const file = e.target.files && e.target.files[0];
    readPhotoFile(file);
    // reset so choosing the same file again still fires onChange
    e.target.value = "";
  }
  function openPhotoPicker() {
    if (photoInputRef.current) photoInputRef.current.click();
  }
  function handlePhotoDrop(e) {
    e.preventDefault();
    setPhotoDrag(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    readPhotoFile(file);

  function upvote(id, e) {
    e.stopPropagation();
    if (upvoted.has(id)) return;
    const updated = reports.map((r) => (r.id === id ? { ...r, votes: r.votes + 1 } : r));
    setReports(updated);
    const nextUpvoted = new Set(upvoted).add(id);
    setUpvoted(nextUpvoted);
    storageSaveIndex(updated);
    storageSaveUpvotes(Array.from(nextUpvoted));
  }
  async function updateStatus(id, status) {
    if (!agentMode) {
      toastMsg("Réservé aux agents municipaux — ouvrez l'espace agent.", 3000);
      return;
    }
    const updated = reports.map((r) => {
      if (r.id !== id) return r;
      if (status === "resolu") return { ...r, status, resolvedAt: r.resolvedAt || Date.now() };
      return { ...r, status, resolvedAt: null };
    });
    setReports(updated);
    toastMsg(`Statut mis à jour : ${STATUS_META[status].label}`, 2600);
    setSyncing(true);
    const ok = await storageSaveIndex(updated);
    setSyncing(false);
    if (!ok) toastMsg("Changement local seulement — synchronisation impossible.", 3000);
    // Notifie le citoyen si un contact a été laissé à la création du signalement.
    notifyBackend("/api/notifications/changement-statut", { reportId: id, nouveauStatut: status });
    const reportRef = reports.find((r) => r.id === id);
    if (reportRef && reportRef.telephone) {
      logNotification({
        to: reportRef.telephone,
        recipientLabel: "citoyen",
        message: `Sen-Collecte : votre signalement ${id} est désormais ${STATUS_LABELS_SMS[status] || status}.`,
      });
    }
    const entry = { ts: Date.now(), label: `${id} → ${STATUS_META[status].label}${agentLabel ? " · " + agentLabel : ""}` };
    const updatedLog = await storageAppendAgentLog(entry);
    if (updatedLog) setAgentLog(updatedLog);
  }
  async function deleteReport(id) {
    if (!agentMode) {
      toastMsg("Réservé aux agents municipaux — ouvrez l'espace agent.", 3000);
      return;
    }
    if (!window.confirm("Supprimer définitivement ce signalement ?")) return;
    const updated = reports.filter((r) => r.id !== id);
    setReports(updated);
    setActiveReportId(null);
    toastMsg("Signalement supprimé.", 2600);
    photoCacheRef.current.delete(id);
    setSyncing(true);
    await Promise.all([storageSaveIndex(updated), storageDeletePhoto(id)]);
    setSyncing(false);
    const entry = { ts: Date.now(), label: `${id} supprimé${agentLabel ? " · " + agentLabel : ""}` };
    const updatedLog = await storageAppendAgentLog(entry);
    if (updatedLog) setAgentLog(updatedLog);
  }
  async function openAgentGate() {
    setAgentCodeInput("");
    setAgentLabelInput("");
    setAgentError("");
    const attempts = await storageLoadAgentAttempts();
    setAgentLockUntil(attempts.lockUntil > Date.now() ? attempts.lockUntil : 0);
    setShowAgentGate(true);
  }
  function closeAgentGate() {
    setShowAgentGate(false);
    setAgentError("");
  }
  async function submitAgentCode(e) {
    e.preventDefault();
    await attemptAgentLogin(agentCodeInput, agentLabelInput);
  }
  // Connexion rapide pour la démonstration : remplit et valide directement le
  // code pilote, pour ne pas obliger un évaluateur à connaître ou recopier le
  // code d'accès pendant une présentation.
  async function quickDemoLogin() {
    setAgentCodeInput(DEMO_AGENT_CODE);
    setAgentLabelInput(DEMO_AGENT_LABEL);
    await attemptAgentLogin(DEMO_AGENT_CODE, DEMO_AGENT_LABEL);
  }
  async function attemptAgentLogin(codeInput, labelInput) {
    const attempts = await storageLoadAgentAttempts();
    if (attempts.lockUntil > Date.now()) {
      setAgentLockUntil(attempts.lockUntil);
      setAgentError(`Trop de tentatives. Réessayez dans ${Math.ceil((attempts.lockUntil - Date.now()) / 1000)} s.`);
      return;
    }
    const normalized = codeInput.trim().toUpperCase();
    const match = agentCodes.find((c) => c.active && c.code.toUpperCase() === normalized);
    if (match) {
      const resetAttempts = { count: 0, lockUntil: 0 };
      storageSaveAgentAttempts(resetAttempts);
      const label = labelInput.trim() || match.label || "Poste agent";
      setAgentMode(true);
      setAgentLabel(label);
      storageSaveAgentMode(true);
      setShowAgentGate(false);
      toastMsg(`Espace agent municipal activé — ${label}.`, 2800);
      const entry = { ts: Date.now(), label, codeLabel: match.label };
      const updatedLog = await storageAppendAgentLog(entry);
      if (updatedLog) setAgentLog(updatedLog);
    } else {
      const nextCount = (attempts.count || 0) + 1;
      const locked = nextCount >= AGENT_LOCK_THRESHOLD;
      const nextState = { count: locked ? 0 : nextCount, lockUntil: locked ? Date.now() + AGENT_LOCK_MS : 0 };
      storageSaveAgentAttempts(nextState);
      if (locked) {
        setAgentLockUntil(nextState.lockUntil);
        setAgentError(`Trop de tentatives échouées. Accès verrouillé ${AGENT_LOCK_MS / 1000} s.`);
      } else {
        setAgentError(`Code invalide. Vérifiez auprès de votre collectivité (${AGENT_LOCK_THRESHOLD - nextCount} essai(s) restant(s)).`);
      }
    }
  }
  function exitAgentMode() {

    storageSaveAgentMode(false);

  function exportCSV() {
    const header = ["ID", "Catégorie", "Statut", "Région", "Département", "Lieu", "Votes", "Coordonnées GPS", "Source GPS"];
    const rows = visibleReports.map((r) => {
      const d = findDept(r.dept);
      // Priorise le GPS précis du citoyen (r.gps) sur les coordonnées du
      // chef-lieu — même logique que l'export PDF (voir gpsTxt plus bas),
      // pour ne pas exporter une position moins précise que celle affichée à l'écran.
      const gpsCoords = r.gps ? fmtCoord(r.gps.lat, r.gps.lon) : d ? fmtCoord(d.lat, d.lon) : "";
      const gpsSource = r.gps ? `Satellite (±${Math.round(r.gps.accuracy)}m)` : d ? "Chef-lieu administratif" : "";
      return [
        r.id,
        catMeta(r.cat).label,
        STATUS_META[r.status].label,
        r.region,
        r.dept,
        r.lieu || "",
        r.votes,
        gpsCoords,
        gpsSource,
      ];
    });
    const csv = [header, ...rows]
      .map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(";"))
      .join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `sen-collecte-signalements-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    toastMsg(`${visibleReports.length} signalement(s) exporté(s) en CSV.`, 2600);
  }

  // --- Rapport PDF (gestion des rapports) ---
  function exportPDF() {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      toastMsg("Génération PDF indisponible — vérifiez votre connexion.", 3200);
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const dateStr = new Date().toLocaleDateString("fr-FR", { year: "numeric", month: "long", day: "numeric" });
    const timeStr = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    // En-tête de marque
    doc.setFillColor(22, 36, 31);
    doc.rect(0, 0, pageW, 70, "F");
    doc.setTextColor(238, 241, 234);

    doc.setFontSize(17);
    doc.text("Sen-Collecte — Rapport de signalements", 32, 32);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9.5);
    doc.setTextColor(126, 217, 176);
    doc.text(`Généré le ${dateStr} à ${timeStr} · Plateforme citoyenne, 5 régions, 17 départements`, 32, 49);

    // Résumé statistique
    let y = 96;
    doc.setTextColor(22, 36, 31);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("Synthèse", 32, y);

  // --- Sauvegarde / restauration complète des données ---
  function exportBackupJSON() {
    const payload = { app: "Sen-Collecte", exportedAt: new Date().toISOString(), reports };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `sen-collecte-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toastMsg(`Sauvegarde complète créée — ${reports.length} signalement(s).`, 2800);
  }
  async function importBackupJSON(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const incoming = Array.isArray(parsed) ? parsed : parsed.reports;
      if (!Array.isArray(incoming)) throw new Error("format invalide");
      setReports(incoming);
      setSyncing(true);
      await storageSaveIndex(incoming);
      setSyncing(false);
      toastMsg(`Sauvegarde restaurée — ${incoming.length} signalement(s).`, 3200);
    } catch (err) {
      toastMsg("Fichier de sauvegarde illisible ou invalide.", 3200);
    }
  }
  // Copie générique dans le presse-papiers, avec repli pour les contextes
  // où l'API Clipboard est indisponible (ex : contenu non sécurisé, ancien navigateur).
  async function copyText(text, successMsg) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      toastMsg(successMsg || "Copié dans le presse-papiers.", 2200);
    } catch {
      toastMsg("Impossible de copier — copiez manuellement.", 2600);
    }
  }

            return (

            </div>

                      </div>

                      <div style={{ fontFamily: "'IBM Plex Mono', ui-monospace, monospace", fontSize: 10, color: "#6f776f", marginTop: 2 }}>{fmtCoord(d.lat, d.lon)} (référence chef-lieu)</div>

                  </span>

            ) : null}

            <div style={{ fontSize: 13.5, color: "#3a463f", marginBottom: 8, lineHeight: 1.6 }}>
              {activeReportObj.lieu && <div><strong>Lieu :</strong> {activeReportObj.lieu}</div>}
              <div><strong>Localité :</strong> {activeReportObj.dept}, {activeReportObj.region}</div>
            </div>

            {activeReportObj.gps ? (
              <div style={{ fontFamily: "'IBM Plex Mono', ui-monospace, monospace", fontSize: 12, color: "#EAF6F1", background: "linear-gradient(135deg, #123B32, #1F5C4F)", padding: "8px 12px", borderRadius: 8, marginBottom: 12 }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 6, fontWeight: 700 }}>
                    <Icon name="Navigation" size={12} color="#7FE0C3" /> {fmtCoord(activeReportObj.gps.lat, activeReportObj.gps.lon)}
                  </span>
                  <button
                    type="button"
                    onClick={() => copyText(`${activeReportObj.gps.lat}, ${activeReportObj.gps.lon}`, "Coordonnées GPS copiées.")}
                    aria-label="Copier les coordonnées GPS"
                    style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10.5, fontWeight: 700, color: "#EAF6F1", background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 999, padding: "3px 8px", cursor: "pointer", flexShrink: 0 }}
                  >
                    Copier
                  </button>
                </div>
                <div style={{ color: "#B9E6D6", fontSize: 10.5, marginTop: 2 }}>
                  Position satellite précise · ±{Math.round(activeReportObj.gps.accuracy)} m
                </div>
              </div>
            ) : (() => {
              const d = findDept(activeReportObj.dept);
              return d ? (
                <div style={{ fontFamily: "'IBM Plex Mono', ui-monospace, monospace", fontSize: 12, color: "#6D28D9", background: "#F1E8D2", padding: "8px 12px", borderRadius: 8, marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                  <span>Position GPS : {fmtCoord(d.lat, d.lon)} <span style={{ color: "#7d867f" }}>(chef-lieu)</span></span>
                  <button
                    type="button"
                    onClick={() => copyText(`${d.lat}, ${d.lon}`, "Coordonnées GPS copiées.")}
                    aria-label="Copier les coordonnées GPS du chef-lieu"
                    style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10.5, fontWeight: 700, color: "#6D28D9", background: "#F7EFDD", border: "1px solid #D9DAD7", borderRadius: 999, padding: "3px 8px", cursor: "pointer", flexShrink: 0 }}
                  >
                    Copier
                  </button>
                </div>
              ) : null;
            })()}

            <div style={{ fontSize: 12.5, color: "#8452C8", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
              <span>{timeAgo(activeReportObj.createdAt)} · {activeReportObj.votes} votes citoyens</span>
              <button onClick={() => exportSingleReportPDF(activeReportObj)} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, fontWeight: 700, color: "#6D28D9", background: "#F1E8D2", border: "1px solid #D9DAD7", borderRadius: 999, padding: "5px 10px", cursor: "pointer" }}>
                <Icon name="Download" size={11} /> Fiche PDF
              </button>
            </div>

            <div id="qn-status-label" style={{ fontSize: 12, fontWeight: 700, color: "#8452C8", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>Statut</div>
            <div role="group" aria-labelledby="qn-status-label" style={{ display: "flex", gap: 6, marginBottom: agentMode ? 20 : 10 }}>
              {Object.entries(STATUS_META).map(([k, v]) => {
                const active = activeReportObj.status === k;
                return (
                  <button key={k} onClick={() => updateStatus(activeReportObj.id, k)} disabled={!agentMode} aria-pressed={active} style={{
                    flex: 1, padding: "8px 0", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: agentMode ? "pointer" : "not-allowed",
                    border: active ? `2px solid ${v.color}` : "1px solid #D9DAD7",
                    background: active ? v.color + "14" : "#F7EFDD",
                    color: active ? v.color : "#8452C8",
                    opacity: agentMode ? 1 : 0.55,
                  }}>
                    {v.label}
                  </button>
                );
              })}
            </div>
            {!agentMode && (
              <div style={{ fontSize: 11.5, color: "#7d867f", marginBottom: 20, display: "flex", alignItems: "center", gap: 5 }}>
                <Icon name="ShieldCheck" size={12} /> Seuls les agents municipaux authentifiés peuvent modifier le statut.
              </div>
            )}

            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => focusOnMap(activeReportObj)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "#33363A", color: "#fff", border: "none", padding: "10px 0", borderRadius: 9, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
                <Icon name="MapPin" size={14} /> Voir sur la carte
              </button>
              {agentMode && (
                <button onClick={() => deleteReport(activeReportObj.id)} aria-label="Supprimer ce signalement" style={{ display: "flex", alignItems: "center", justifyContent: "center", background: "#F7EFDD", color: "#E8542C", border: "1px solid #E8542C", padding: "10px 14px", borderRadius: 9, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
                  <Icon name="Trash2" size={14} />
                </button>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Agent access modal */}
      {showAgentGate && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(22,36,31,0.5)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 55 }} onClick={closeAgentGate}>
          <form ref={agentModalRef} onSubmit={submitAgentCode} onClick={(e) => e.stopPropagation()} role="dialog" aria-modal="true" aria-labelledby="qn-agent-title" className="qn-modal-pop" style={{ background: "#F7EFDD", borderRadius: 16, padding: 24, width: "100%", maxWidth: 380 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <Icon name="ShieldCheck" size={18} color="#6D28D9" />
                <span id="qn-agent-title" style={{ fontWeight: 900, fontSize: 16 }}>Espace agent municipal</span>
              </div>
              <button type="button" onClick={closeAgentGate} aria-label="Fermer la fenêtre" className="qn-icon-btn" style={{ background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <Icon name="X" size={20} />
              </button>
            </div>
            <p style={{ fontSize: 12.5, color: "#8452C8", lineHeight: 1.6, margin: "0 0 14px" }}>
              Réservé aux agents des collectivités partenaires : la mise à jour du statut et la suppression des signalements sont limitées à cet espace pour préserver l'intégrité du fil public.
            </p>
            <label htmlFor="qn-agent-label" style={{ fontSize: 12, fontWeight: 700, color: "#8452C8", display: "block", marginBottom: 6 }}>Collectivité / poste (optionnel)</label>
            <input
              id="qn-agent-label"
              value={agentLabelInput}
              onChange={(e) => setAgentLabelInput(e.target.value)}
              placeholder="Ex : Mairie de Kaolack"
              autoFocus
              disabled={agentLockUntil > Date.now()}
              style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #D9DAD7", fontSize: 13.5, marginBottom: 14 }}
            />
            <label htmlFor="qn-agent-code" style={{ fontSize: 12, fontWeight: 700, color: "#8452C8", display: "block", marginBottom: 6 }}>Code d'accès</label>
            <input
              id="qn-agent-code"
              value={agentCodeInput}
              onChange={(e) => { setAgentCodeInput(e.target.value); setAgentError(""); }}
              placeholder="Ex : AGENT-SN-8834"
              disabled={agentLockUntil > Date.now()}
              style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: agentError ? "1px solid #E8542C" : "1px solid #D9DAD7", fontSize: 13.5, marginBottom: agentError ? 6 : 16, fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }}
            />
            {agentError && <div role="alert" style={{ fontSize: 12, color: "#E8542C", marginBottom: 14 }}>{agentError}</div>}
            <button type="submit" disabled={agentLockUntil > Date.now()} style={{ width: "100%", background: agentLockUntil > Date.now() ? "#b7bdb4" : "#6D28D9", color: "#fff", border: "none", padding: "12px 0", borderRadius: 9, fontWeight: 700, fontSize: 14.5, cursor: agentLockUntil > Date.now() ? "not-allowed" : "pointer" }}>
              {agentLockUntil > Date.now() ? "Accès temporairement verrouillé" : "Activer l'espace agent"}
            </button>
            <button type="button" onClick={quickDemoLogin} disabled={agentLockUntil > Date.now()} style={{ width: "100%", background: "none", color: "#6D28D9", border: "1px dashed #b7bdb4", padding: "10px 0", borderRadius: 9, fontWeight: 700, fontSize: 12.5, cursor: agentLockUntil > Date.now() ? "not-allowed" : "pointer", marginTop: 8, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              <Icon name="ShieldCheck" size={13} /> Connexion démo (code pilote)
            </button>
            <p style={{ fontSize: 10.5, color: "#b7bdb4", marginTop: 12, textAlign: "center" }}>
              Zone pilote — codes gérés par les collectivités partenaires depuis l'espace agent.
            </p>
          </form>
        </div>
      )}

      {/* Panneau des notifications SMS simulées */}
      {showNotifPanel && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(22,36,31,0.5)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 55 }} onClick={() => setShowNotifPanel(false)}>
          <div role="dialog" aria-modal="true" aria-labelledby="qn-notif-title" onClick={(e) => e.stopPropagation()} className="qn-modal-pop" style={{ background: "#F7EFDD", borderRadius: 16, padding: 24, width: "100%", maxWidth: 460, maxHeight: "82vh", display: "flex", flexDirection: "column" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span id="qn-notif-title" style={{ fontWeight: 900, fontSize: 17, display: "flex", alignItems: "center", gap: 8 }}>
                <Icon name="Bell" size={17} color="#6D28D9" /> SMS simulés
              </span>
              <button type="button" onClick={() => setShowNotifPanel(false)} aria-label="Fermer la fenêtre" className="qn-icon-btn" style={{ background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <Icon name="X" size={20} />
              </button>
            </div>
            <p style={{ fontSize: 12, color: "#6f776f", marginBottom: 16 }}>
              {NOTIFICATION_API_BASE_URL
                ? "Trace locale des notifications, en plus des envois réels via le backend configuré."
                : "Aucun backend de notification n'est configuré : ceci simule ce que la plateforme enverrait réellement par SMS aux agents et aux citoyens."}
            </p>
            <div style={{ overflowY: "auto", display: "flex", flexDirection: "column", gap: 10 }}>
              {notifLog.length === 0 && (
                <div style={{ fontSize: 13.5, color: "#6f776f", padding: "20px 0", textAlign: "center" }}>
                  Aucun SMS simulé pour l'instant — créez un signalement ou changez un statut (espace agent).
                </div>
              )}
              {notifLog.map((n) => (
                <div key={n.id} style={{ border: "1px solid #D9DAD7", borderRadius: 10, padding: "10px 12px", background: n.recipientLabel === "agent" ? "#F1E8D2" : "#FCEFE4" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, gap: 8 }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 700, color: n.recipientLabel === "agent" ? "#33363A" : "#6D28D9" }}>
                      <Icon name="MessageSquare" size={12} /> {n.to}
                    </span>
                    <span style={{ fontFamily: "'IBM Plex Mono', ui-monospace, monospace", fontSize: 10.5, color: "#7d867f", whiteSpace: "nowrap" }}>
                      {new Date(n.ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}
                    </span>
                  </div>
                  <div style={{ fontSize: 13, color: "#20231F", lineHeight: 1.4 }}>{n.message}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && (
        <div role="status" aria-live="polite" style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "#33363A", color: "#F0E6CE", padding: "12px 20px", borderRadius: 10, display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, zIndex: 60, boxShadow: "0 8px 24px rgba(0,0,0,0.2)", textAlign: "center" }}>
          <Icon name="CheckCircle2" size={16} color="#7ed9b0" /> {toast}
        </div>
      )}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..500&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        @keyframes qn-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
        @keyframes qn-spin { to { transform: rotate(360deg); } }
        @keyframes qn-radar { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }
        @keyframes qn-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes qn-modal-pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @media (max-width: 760px) { .qn-hero-grid { grid-template-columns: 1fr !important; } }
        [id] { scroll-margin-top: 68px; }

        /* --- Lien d'évitement (accessibilité clavier) --- */
        .qn-skip-link {
          position: absolute; left: 12px; top: -60px; z-index: 100; background: #33363A; color: #F0E6CE;
          padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 13px;
          text-decoration: none; transition: top .15s ease;
        }
        .qn-skip-link:focus { top: 12px; }

        /* --- Cibles tactiles agrandies (boutons icône) --- */
        .qn-icon-btn { min-width: 40px; min-height: 40px; border-radius: 8px; }
        .qn-icon-btn:hover { background: #F1E8D2 !important; }

        /* --- Apparition douce des fenêtres modales --- */
        .qn-modal-pop { animation: qn-modal-pop .22s cubic-bezier(0.16,1,0.3,1) both; }

        .qn-nav-btn { position: relative; transition: color .15s; }
        .qn-nav-btn:hover { color: #33363A; }
        .qn-nav-btn:hover::after, .qn-nav-btn[data-active="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 6px; height: 2px; background: #6D28D9; border-radius: 2px; }
        .qn-nav-btn[data-active="true"] { color: #33363A; }
        .qn-report-card { transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease; animation: qn-rise .35s ease backwards; }
        .qn-report-card:hover { box-shadow: 0 10px 24px rgba(22,36,31,0.09); transform: translateY(-2px); border-color: #c7cec0; }
        @media (hover: none) {
          /* Retrait du hover-lift sur écrans tactiles : évite l'effet "collé" après un tap */
          .qn-report-card:hover { transform: none; }
        }
        .qn-elevate { transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease; }
        .qn-elevate:hover { box-shadow: 0 12px 28px rgba(22,36,31,0.08); }
        button:not(:disabled), select, .qn-photo-drop { transition: filter .15s ease, box-shadow .15s ease, transform .1s ease, background-color .15s ease, border-color .15s ease; }
        button:not(:disabled):hover { filter: brightness(1.05); }
        button:not(:disabled):active { transform: translateY(1px); }
        input:focus, select:focus { border-color: #6D28D9 !important; box-shadow: 0 0 0 3px rgba(194,87,15,0.12); outline: none; }
        button:focus-visible, input:focus-visible, select:focus-visible, [role="button"]:focus-visible {
          outline: 2px solid #6D28D9; outline-offset: 2px;
        }

        /* -----------------------------------------------------------------
           Mobile — tablette (≤ 760px) : en-tête, recherche, espacements
           ----------------------------------------------------------------- */
        @media (max-width: 760px) {
          .qn-header-inner { padding-top: 14px !important; padding-bottom: 14px !important; gap: 10px !important; }
          .qn-header-actions { width: 100%; justify-content: flex-start !important; gap: 6px !important; }
          .qn-header-badge-regions { display: none; }
          .qn-signalements-head { flex-direction: column; align-items: stretch !important; }
          .qn-search-wrap { width: 100%; }
          .qn-search-input { width: 100% !important; box-sizing: border-box; }
        }
        .qn-scroll-x { -webkit-overflow-scrolling: touch; scrollbar-width: thin; }

        /* -----------------------------------------------------------------
           Mobile étroit (≤ 480px) : compacité des badges et sections
           ----------------------------------------------------------------- */
        @media (max-width: 480px) {
          .qn-header-inner { padding-left: 16px !important; padding-right: 16px !important; }
          section { padding-left: 16px !important; padding-right: 16px !important; }
        }

        @media (prefers-reduced-motion: reduce) {
          * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
          .qn-report-card:hover, .qn-elevate:hover { transform: none !important; }
        }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<QuartierNetGPS />);

</script>
</body>
</html>
